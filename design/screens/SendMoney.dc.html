<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
@keyframes pin-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pin-caret{animation:pin-blink 1s step-end infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes gk-fly{0%{transform:translateX(-96px) scale(.7);opacity:0}15%{opacity:1;transform:translateX(-70px) scale(1)}85%{opacity:1;transform:translateX(70px) scale(1)}100%{transform:translateX(96px) scale(.7);opacity:0}}
@keyframes gk-pulse{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes gk-fill{0%{width:0}100%{width:100%}}
@keyframes gk-pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gk-draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes gk-rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes gk-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(.4);opacity:0}}
@keyframes gk-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.gk-fly{animation:gk-fly 1.1s cubic-bezier(.45,0,.25,1) infinite}
.gk-pulse{animation:gk-pulse 1.1s ease-out infinite}
.gk-fill{animation:gk-fill 1.8s ease-in-out both}
.gk-pop{animation:gk-pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.gk-draw{stroke-dasharray:24;animation:gk-draw .45s .35s ease-out both}
.gk-rise{animation:gk-rise .45s ease-out both}
.gk-d1{animation-delay:.45s}.gk-d2{animation-delay:.6s}.gk-d3{animation-delay:.75s}
.gk-burst{animation:gk-burst .8s .3s ease-out both}
.gk-ring{animation:gk-ring .9s .2s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<div style="display: flex; align-items: center; gap: 12px; height: 44px;">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E1E7E3; display: flex; align-items: center; justify-content: center; color: #10201B; box-sizing: border-box;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
<div style="font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600;">Send money</div>
</div>
<div style="margin-top: 20px; align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; background: #E3F1EC; color: #0B6B57; font-size: 14px; font-weight: 700;">Available: $131.50</div>
<div style="margin-top: 20px; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="receiver" style="font-size: 14px; font-weight: 600; color: #10201B;">Receiver's phone number</label>
<div style="display: flex; align-items: center; height: 56px; border-radius: 16px; background: #FFFFFF; border: 2px solid #0B6B57; box-sizing: border-box; overflow: hidden;">
<div style="padding: 0 14px; height: 100%; display: flex; align-items: center; font-weight: 700; font-size: 16px; color: #10201B; border-right: 1px solid #E1E7E3;">+252</div>
<input id="receiver" type="tel" inputmode="numeric" value="61 555 4521" placeholder="61 234 5678" style="flex-grow: 1; min-width: 0; height: 100%; border: none; outline: none; padding: 0 14px; font-size: 17px; font-weight: 600; letter-spacing: 0.04em; color: #10201B; background: transparent;">
</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #0B6B57;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg>Registered wallet · 61X XXX 4521</div>
</div>
<div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px;">
<label for="amount" style="font-size: 14px; font-weight: 600;">Amount (USD)</label>
<div style="background: #FFFFFF; border: 1px solid #E1E7E3; border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; gap: 4px;">
<div style="font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 700; color: #56665F;">$</div>
<input id="amount" type="text" inputmode="decimal" value="{{amount}}" onChange="{{typeAmount}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: #10201B;">
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 4px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="box-sizing: border-box; {{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1;"></div>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #56665F; font-size: 13px; text-align: center; margin-bottom: 14px;">No fees. Money arrives instantly.</p>
<a href="ConfirmSend.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #0B6B57; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; border: none; width: 100%; box-sizing: border-box;">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { amount: '10.00' }; }
  renderVals() {
    const amount = this.state.amount;
    const chips = ['5', '10', '20', '50'].map((v) => {
      const on = parseFloat(amount) === parseFloat(v);
      return {
        label: '$' + v,
        pick: () => this.setState({ amount: v + '.00' }),
        style: 'height: 44px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: ' + (on ? '2px solid #0B6B57' : '1px solid #E1E7E3') + '; background: ' + (on ? '#E3F1EC' : '#FFFFFF') + '; color: ' + (on ? '#0B6B57' : '#10201B') + ';'
      };
    });
    return { amount, chips, typeAmount: (e) => this.setState({ amount: e.target.value }) };
  }
}
</script>
</body>
</html>
