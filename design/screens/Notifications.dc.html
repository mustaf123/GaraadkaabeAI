<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
@keyframes gk-fly{0%{transform:translateX(-96px) scale(.7);opacity:0}15%{opacity:1;transform:translateX(-70px) scale(1)}85%{opacity:1;transform:translateX(70px) scale(1)}100%{transform:translateX(96px) scale(.7);opacity:0}}
@keyframes gk-pulse{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes gk-fill{0%{width:0}100%{width:100%}}
@keyframes gk-pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gk-draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes gk-rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes gk-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(.4);opacity:0}}
@keyframes gk-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.gk-fly{animation:gk-fly 1.1s cubic-bezier(.45,0,.25,1) infinite}
.gk-pulse{animation:gk-pulse 1.1s ease-out infinite}
.gk-fill{animation:gk-fill 1.8s ease-in-out both}
.gk-pop{animation:gk-pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.gk-draw{stroke-dasharray:24;animation:gk-draw .45s .35s ease-out both}
.gk-rise{animation:gk-rise .45s ease-out both}
.gk-d1{animation-delay:.45s}.gk-d2{animation-delay:.6s}.gk-d3{animation-delay:.75s}
.gk-burst{animation:gk-burst .8s .3s ease-out both}
.gk-ring{animation:gk-ring .9s .2s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 96px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<div style="display: flex; align-items: center; gap: 12px; height: 44px;">
<div style="flex-grow: 1; display: flex; align-items: center; gap: 8px;">
<div style="font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600;">Notifications</div>
<sc-if value="{{hasUnread}}" hint-placeholder-val="{{true}}"><div style="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 999px; background: #0B6B57; color: #FFFFFF; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{unreadCount}}</div></sc-if>
</div>
<button type="button" onClick="{{markAll}}" style="height: 44px; padding: 0 4px; border: none; background: transparent; color: #0B6B57; font-size: 14px; font-weight: 700; cursor: pointer;">Mark all read</button>
</div>
<div style="margin-top: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E4EAE6;">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<button type="button" aria-pressed="{{tab.pressed}}" onClick="{{tab.pick}}" style="box-sizing: border-box; {{tab.style}}">{{tab.label}}</button>
</sc-for>
</div>
<div style="margin-top: 4px; display: flex; flex-direction: column;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #56665F; margin: 16px 0 8px 4px;">{{g.label}}</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<sc-for list="{{g.items}}" as="n" hint-placeholder-count="2">
<button type="button" onClick="{{n.read}}" style="box-sizing: border-box; {{n.style}}">
<sc-if value="{{n.is_sent}}" hint-placeholder-val="{{false}}"><div style="width: 42px; height: 42px; border-radius: 14px; background: #FCE8E6; color: #B42318; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></div></sc-if>
<sc-if value="{{n.is_received}}" hint-placeholder-val="{{false}}"><div style="width: 42px; height: 42px; border-radius: 14px; background: #E3F1EC; color: #0B6B57; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7L7 17"></path><path d="M16 17H7V8"></path></svg></div></sc-if>
<sc-if value="{{n.is_security}}" hint-placeholder-val="{{false}}"><div style="width: 42px; height: 42px; border-radius: 14px; background: #FDF3DC; color: #7A5A12; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg></div></sc-if>
<sc-if value="{{n.is_welcome}}" hint-placeholder-val="{{false}}"><div style="width: 42px; height: 42px; border-radius: 14px; background: #E3F1EC; color: #0B6B57; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="5" rx="1"></rect><path d="M5 13v7h14v-7"></path><path d="M12 8v12"></path><path d="M12 8S10.5 3 8 4.5 9.5 8 12 8zm0 0s1.5-5 4-3.5S14.5 8 12 8z"></path></svg></div></sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left;">
<div style="display: flex; align-items: center; gap: 8px;">
<div style="flex-grow: 1; font-size: 15px; font-weight: 800; color: #10201B;">{{n.title}}</div>
<div style="font-size: 12px; font-weight: 600; color: #56665F;">{{n.time}}</div>
</div>
<div style="font-size: 13px; line-height: 1.45; color: #56665F;">{{n.body}}</div>
</div>
<sc-if value="{{n.unread}}" hint-placeholder-val="{{false}}"><div aria-label="Unread" style="width: 9px; height: 9px; border-radius: 50%; background: #0B6B57; flex-shrink: 0; margin-top: 6px;"></div></sc-if>
</button>
</sc-for>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding: 8px 12px 14px; background: #F3F5F2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
<a href="Home.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.2L12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="History.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>
<a href="Notifications.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0B6B57; font-size: 13px; font-weight: 800;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Alerts<div style="position: absolute; top: 0; left: 50%; margin-left: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E5484D; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">3</div></a>
<a href="Profile.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All', read: {} }; }
  renderVals() {
    const s = this.state;
    const data = [{"id": 1, "kind": "sent", "group": "Today", "title": "Money sent", "body": "You sent $10.00 to 61X XXX 4521. New balance $121.50.", "time": "19:12", "unread": true}, {"id": 2, "kind": "security", "group": "Today", "title": "New login", "body": "You logged in on this phone with your fingerprint.", "time": "19:10", "unread": true}, {"id": 3, "kind": "received", "group": "Today", "title": "Money received", "body": "You received $25.00 from 61X XXX 7710.", "time": "14:05", "unread": true}, {"id": 4, "kind": "sent", "group": "Yesterday", "title": "Money sent", "body": "You sent $5.50 to 61X XXX 3308.", "time": "20:41", "unread": false}, {"id": 5, "kind": "received", "group": "Yesterday", "title": "Money received", "body": "You received $12.00 from 61X XXX 9124.", "time": "09:15", "unread": false}, {"id": 6, "kind": "security", "group": "21 Sep 2026", "title": "Fingerprint login turned on", "body": "You can now log in with your fingerprint or your PIN.", "time": "10:03", "unread": false}, {"id": 7, "kind": "welcome", "group": "21 Sep 2026", "title": "Welcome to GaraadKaabeAI", "body": "Your wallet is ready with a $100.00 demo balance.", "time": "10:02", "unread": false}];
    const isUnread = (n) => n.unread && !s.read[n.id];
    const shown = data.filter((n) => s.tab === 'All' || (s.tab === 'Money' ? (n.kind === 'sent' || n.kind === 'received') : (n.kind === 'security' || n.kind === 'welcome')));
    const groups = [];
    shown.forEach((n) => {
      let g = groups.find((x) => x.label === n.group);
      if (!g) { g = { label: n.group, items: [] }; groups.push(g); }
      const un = isUnread(n);
      g.items.push({ ...n, unread: un,
        is_sent: n.kind === 'sent', is_received: n.kind === 'received', is_security: n.kind === 'security', is_welcome: n.kind === 'welcome',
        read: () => this.setState((x) => ({ read: { ...x.read, [n.id]: true } })),
        style: 'width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 18px; cursor: pointer; font-family: inherit; border: 1px solid ' + (un ? '#BFDDD3' : '#E1E7E3') + '; background: ' + (un ? '#F2FAF7' : '#FFFFFF') + ';' });
    });
    const unreadCount = data.filter(isUnread).length;
    const tabs = ['All', 'Money', 'Security'].map((label) => {
      const on = label === s.tab;
      return { label, pressed: on ? 'true' : 'false', pick: () => this.setState({ tab: label }),
        style: 'height: 40px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: ' + (on ? '#FFFFFF' : 'transparent') + '; color: ' + (on ? '#10201B' : '#56665F') + '; box-shadow: ' + (on ? '0 1px 3px rgba(16,32,27,0.12)' : 'none') + ';' };
    });
    return { groups, tabs, unreadCount: String(unreadCount), hasUnread: unreadCount > 0,
      markAll: () => this.setState({ read: data.reduce((m, n) => ({ ...m, [n.id]: true }), {}) }) };
  }
}
</script>
</body>
</html>
