<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
@keyframes pin-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pin-caret{animation:pin-blink 1s step-end infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes gk-fly{0%{transform:translateX(-96px) scale(.7);opacity:0}15%{opacity:1;transform:translateX(-70px) scale(1)}85%{opacity:1;transform:translateX(70px) scale(1)}100%{transform:translateX(96px) scale(.7);opacity:0}}
@keyframes gk-pulse{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes gk-fill{0%{width:0}100%{width:100%}}
@keyframes gk-pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gk-draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes gk-rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes gk-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(.4);opacity:0}}
@keyframes gk-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.gk-fly{animation:gk-fly 1.1s cubic-bezier(.45,0,.25,1) infinite}
.gk-pulse{animation:gk-pulse 1.1s ease-out infinite}
.gk-fill{animation:gk-fill 1.8s ease-in-out both}
.gk-pop{animation:gk-pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.gk-draw{stroke-dasharray:24;animation:gk-draw .45s .35s ease-out both}
.gk-rise{animation:gk-rise .45s ease-out both}
.gk-d1{animation-delay:.45s}.gk-d2{animation-delay:.6s}.gk-d3{animation-delay:.75s}
.gk-burst{animation:gk-burst .8s .3s ease-out both}
.gk-ring{animation:gk-ring .9s .2s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 96px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<div style="display: flex; align-items: center; gap: 12px; height: 44px;">
<div style="font-family: 'Sora', sans-serif; font-size: 17px; font-weight: 600;">History</div>
</div>
<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #E4EAE6;">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="3">
<button type="button" aria-pressed="{{tab.pressed}}" onClick="{{tab.pick}}" style="box-sizing: border-box; {{tab.style}}">{{tab.label}}</button>
</sc-for>
</div>
<div style="margin-top: 8px; display: flex; flex-direction: column;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="font-size: 13px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #56665F; margin: 18px 0 6px;">{{g.label}}</div>
<div style="background: #FFFFFF; border: 1px solid #E1E7E3; border-radius: 20px; padding: 4px 16px;">
<sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
<a href="Receipt.dc.html" style="display: flex; align-items: center; gap: 12px; height: 64px; text-decoration: none;">
<sc-if value="{{t.sent}}" hint-placeholder-val="{{true}}"><div style="width: 40px; height: 40px; border-radius: 50%; background: #FCE8E6; color: #B42318; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg></div></sc-if>
<sc-if value="{{t.received}}" hint-placeholder-val="{{false}}"><div style="width: 40px; height: 40px; border-radius: 50%; background: #E3F1EC; color: #0B6B57; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 7L7 17"></path><path d="M16 17H7V8"></path></svg></div></sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
<div style="font-size: 15px; font-weight: 700; color: #10201B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.title}}</div>
<div style="font-size: 13px; color: #56665F;">{{t.when}}</div>
</div>
<sc-if value="{{t.sent}}" hint-placeholder-val="{{true}}"><div style="font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: #10201B;">{{t.amt}}</div></sc-if>
<sc-if value="{{t.received}}" hint-placeholder-val="{{false}}"><div style="font-family: 'Sora', sans-serif; font-size: 15px; font-weight: 600; color: #0B6B57;">{{t.amt}}</div></sc-if>
</a>
</sc-for>
</div>
</sc-for>
</div>
<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; box-sizing: border-box; padding: 8px 12px 14px; background: #F3F5F2; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
<a href="Home.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.2L12 4l9 7.2V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
<a href="History.dc.html" aria-current="page" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0B6B57; font-size: 13px; font-weight: 800;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>History</a>
<a href="Notifications.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>Alerts<div style="position: absolute; top: 0; left: 50%; margin-left: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E5484D; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;">3</div></a>
<a href="Profile.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #56665F; font-size: 13px; font-weight: 700;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'All' }; }
  renderVals() {
    const cur = this.state.tab;
    const all = [{"sent": true, "who": "61X XXX 4521", "when": "Today, 19:12", "group": "Today", "amt": "−$10.00"}, {"sent": false, "who": "61X XXX 7710", "when": "Today, 14:05", "group": "Today", "amt": "+$25.00"}, {"sent": true, "who": "61X XXX 3308", "when": "Yesterday, 20:41", "group": "Yesterday", "amt": "−$5.50"}, {"sent": false, "who": "61X XXX 9124", "when": "Yesterday, 09:15", "group": "Yesterday", "amt": "+$12.00"}, {"sent": false, "who": "Welcome balance (demo)", "when": "21 Sep, 10:02", "group": "21 Sep 2026", "amt": "+$100.00", "demo": true}].map((t) => ({ ...t, received: !t.sent, title: t.demo ? t.who : (t.sent ? 'Sent to ' : 'Received from ') + t.who }));
    const shown = all.filter((t) => cur === 'All' || (cur === 'Sent' ? t.sent : !t.sent));
    const groups = [];
    shown.forEach((t) => {
      let g = groups.find((x) => x.label === t.group);
      if (!g) { g = { label: t.group, items: [] }; groups.push(g); }
      g.items.push(t);
    });
    const tabs = ['All', 'Sent', 'Received'].map((label) => {
      const on = label === cur;
      return {
        label, pressed: on ? 'true' : 'false',
        pick: () => this.setState({ tab: label }),
        style: 'height: 40px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: ' + (on ? '#FFFFFF' : 'transparent') + '; color: ' + (on ? '#10201B' : '#56665F') + '; box-shadow: ' + (on ? '0 1px 3px rgba(16,32,27,0.12)' : 'none') + ';'
      };
    });
    return { tabs, groups };
  }
}
</script>
</body>
</html>
