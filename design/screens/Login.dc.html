<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
@keyframes pin-blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.pin-caret{animation:pin-blink 1s step-end infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
@keyframes gk-fly{0%{transform:translateX(-96px) scale(.7);opacity:0}15%{opacity:1;transform:translateX(-70px) scale(1)}85%{opacity:1;transform:translateX(70px) scale(1)}100%{transform:translateX(96px) scale(.7);opacity:0}}
@keyframes gk-pulse{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes gk-fill{0%{width:0}100%{width:100%}}
@keyframes gk-pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gk-draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes gk-rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes gk-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(.4);opacity:0}}
@keyframes gk-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.gk-fly{animation:gk-fly 1.1s cubic-bezier(.45,0,.25,1) infinite}
.gk-pulse{animation:gk-pulse 1.1s ease-out infinite}
.gk-fill{animation:gk-fill 1.8s ease-in-out both}
.gk-pop{animation:gk-pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.gk-draw{stroke-dasharray:24;animation:gk-draw .45s .35s ease-out both}
.gk-rise{animation:gk-rise .45s ease-out both}
.gk-d1{animation-delay:.45s}.gk-d2{animation-delay:.6s}.gk-d3{animation-delay:.75s}
.gk-burst{animation:gk-burst .8s .3s ease-out both}
.gk-ring{animation:gk-ring .9s .2s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<div style="margin: -24px -24px 0; height: 250px; flex-shrink: 0; background: #0B6B57; position: relative; overflow: hidden; padding: 24px 24px 0; box-sizing: border-box; color: #FFFFFF; display: flex; flex-direction: column;">
<div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 40px solid rgba(255,255,255,0.06); right: -110px; top: -120px;"></div>
<div style="position: absolute; width: 150px; height: 150px; border-radius: 50%; background: rgba(242,181,68,0.14); left: -60px; bottom: -40px;"></div>
<div style="display: flex; align-items: center; gap: 10px; position: relative;"><svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#FFFFFF"></rect><path d="M64.97 37.03 A24 24 0 1 0 72 54 H50" fill="none" stroke="#0B6B57" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M78 13 C79.2 20.5 81.5 22.8 89 24 C81.5 25.2 79.2 27.5 78 35 C76.8 27.5 74.5 25.2 67 24 C74.5 22.8 76.8 20.5 78 13 Z" fill="#F2B544"></path></svg><div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; color: #FFFFFF; white-space: nowrap;">GaraadKaabe<span style="color: #F2B544;">AI</span></div></div>
<div style="margin-top: 34px; position: relative; display: flex; flex-direction: column; gap: 12px;">
<h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 30px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; color: #FFFFFF;">Welcome back</h1>
<div style="display: flex; align-items: center; gap: 10px;">
<div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255,255,255,0.14); font-size: 14px; font-weight: 700;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>61X XXX 2046</div>
<a href="Phone.dc.html" style="color: #FFFFFF; font-size: 14px; font-weight: 700; min-height: 34px; display: flex; align-items: center;">Not you?</a>
</div>
</div>
</div>
<div style="margin: -28px -24px -32px; flex-grow: 1; background: #F3F5F2; border-radius: 28px 28px 0 0; padding: 22px 24px 28px; position: relative; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="font-size: 16px; font-weight: 800; color: #10201B;">Enter your 4-digit PIN</div>
<button type="button" onClick="{{toggleShow}}" aria-pressed="{{showPressed}}" style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border-radius: 10px; border: none; background: transparent; color: #0B6B57; font-size: 14px; font-weight: 700; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>{{showLabel}}</button>
</div>
<div style="margin-top: 12px;"><div style="display: flex; justify-content: center; gap: 14px;">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
<sc-if value="{{b.showDigit}}" hint-placeholder-val="{{false}}"><div style="width: 64px; height: 68px; box-sizing: border-box; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #0B6B57; font-family: 'Sora', sans-serif; font-size: 28px; font-weight: 700; color: #10201B;">{{b.digit}}</div></sc-if>
<sc-if value="{{b.showDot}}" hint-placeholder-val="{{false}}"><div style="width: 64px; height: 68px; box-sizing: border-box; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #0B6B57;"><div style="width: 14px; height: 14px; border-radius: 50%; background: #10201B;"></div></div></sc-if>
<sc-if value="{{b.active}}" hint-placeholder-val="{{false}}"><div style="width: 64px; height: 68px; box-sizing: border-box; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border: 2px solid #0B6B57; box-shadow: 0 0 0 4px rgba(11,107,87,0.15);"><div class="pin-caret" style="width: 2px; height: 26px; border-radius: 2px; background: #0B6B57;"></div></div></sc-if>
<sc-if value="{{b.empty}}" hint-placeholder-val="{{true}}"><div style="width: 64px; height: 68px; box-sizing: border-box; border-radius: 18px; display: flex; align-items: center; justify-content: center; background: #E9EEEB; border: 1.5px solid #D5DED9;"></div></sc-if>
</sc-for>
</div></div>
<div style="flex-grow: 1; min-height: 16px;"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<sc-if value="{{k.isDigit}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{k.press}}" style="height: 50px; border: none; border-radius: 16px; background: #FFFFFF; font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 600; color: #10201B; cursor: pointer;">{{k.label}}</button></sc-if>
<sc-if value="{{k.isDel}}" hint-placeholder-val="{{false}}"><button type="button" aria-label="Delete last digit" onClick="{{k.press}}" style="height: 50px; border: none; border-radius: 16px; background: transparent; color: #10201B; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"></path><path d="M17 9l-5 6"></path><path d="M12 9l5 6"></path></svg></button></sc-if>
<sc-if value="{{k.isBlank}}" hint-placeholder-val="{{false}}"><div style="height: 50px;"></div></sc-if>
</sc-for>
</div>
<div style="margin-top: 16px;"><sc-if value="{{full}}" hint-placeholder-val="{{false}}"><a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #0B6B57; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; border: none; width: 100%; box-sizing: border-box;">Login</a></sc-if>
<sc-if value="{{notFull}}" hint-placeholder-val="{{true}}"><button type="button" disabled="{{true}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #C9D3CE; color: #FFFFFF; font-size: 16px; font-weight: 700; border: none; width: 100%;">Login</button></sc-if></div>
<div style="display: flex; align-items: center; gap: 12px; margin: 10px 0; font-size: 13px; font-weight: 600; color: #56665F;">
<div style="flex-grow: 1; height: 1px; background: #E1E7E3;"></div>or<div style="flex-grow: 1; height: 1px; background: #E1E7E3;"></div>
</div>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #FFFFFF; color: #10201B; font-size: 16px; font-weight: 700; text-decoration: none; border: 1px solid #E1E7E3; width: 100%; box-sizing: border-box; color: #0B6B57;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11c0 3.5-1 6.5-3 9"></path><path d="M8.5 7.6A5 5 0 0 1 17 11c0 2.5-.3 4.8-1 7"></path><path d="M5 15.5c.6-1.4 1-3 1-4.5a6 6 0 0 1 .9-3.2"></path><path d="M12 3a8 8 0 0 1 8 8c0 1.4-.1 2.8-.3 4"></path><path d="M4 8a9 9 0 0 1 3.5-4"></path><path d="M14 13.5c0 2.5-.5 4.7-1.5 6.5"></path></svg>Use your fingerprint</a>
<a href="ForgotPin.dc.html" style="margin-top: 10px; align-self: center; font-size: 14px; font-weight: 700; min-height: 24px;">Forgot PIN?</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pin: '48', show: false }; }
  renderVals() {
    const pin = this.state.pin;
    const show = this.state.show;
    const boxes = [0,1,2,3].map((i) => {
      const filled = i < pin.length;
      return {
        digit: filled ? pin[i] : '',
        showDigit: filled && show,
        showDot: filled && !show,
        active: i === pin.length,
        empty: !filled && i !== pin.length
      };
    });
    const press = (v) => () => this.setState((s) => {
      if (v === 'del') return { pin: s.pin.slice(0, -1) };
      return s.pin.length < 4 ? { pin: s.pin + v } : null;
    });
    const keys = ['1','2','3','4','5','6','7','8','9','','0','del'].map((v) => ({
      label: v, isDigit: v !== '' && v !== 'del', isDel: v === 'del', isBlank: v === '', press: press(v)
    }));
    return {
      keys, boxes, full: pin.length === 4, notFull: pin.length < 4,
      showLabel: show ? 'Hide' : 'Show', showPressed: show ? 'true' : 'false',
      toggleShow: () => this.setState((s) => ({ show: !s.show }))
    };
  }
}
</script>
</body>
</html>
