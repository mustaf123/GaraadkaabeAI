<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recovery code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<div style="display: flex; align-items: center; gap: 10px;">
<svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#0B6B57"></rect><path d="M64.97 37.03 A24 24 0 1 0 72 54 H50" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"></path><path d="M78 13 C79.2 20.5 81.5 22.8 89 24 C81.5 25.2 79.2 27.5 78 35 C76.8 27.5 74.5 25.2 67 24 C74.5 22.8 76.8 20.5 78 13 Z" fill="#F2B544"></path></svg>
<div style="font-family: 'Sora', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: #10201B; white-space: nowrap;">GaraadKaabe<span style="color: #0B6B57;">AI</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 32px;">
<h1 style="margin: 0; font-family: 'Sora', sans-serif; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; color: #10201B;">Save your recovery code</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #56665F;">If you forget your PIN, this code is the only way back into your wallet. We show it only once.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E1E7E3; border-radius: 20px; margin-top: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; align-items: center;">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #56665F;">Recovery code</div>
<div style="font-family: 'Sora', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: 0.14em; color: #10201B;">K7M2-9QXA</div>
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid #E1E7E3; background: #F3F5F2; color: #10201B; font-size: 14px; font-weight: 700; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Copy code</button>
</div>
<div style="margin-top: 16px; padding: 16px; border-radius: 16px; background: #FDF3DC; color: #7A5A12; display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5;">
<div style="flex-shrink: 0; margin-top: 1px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg></div>
<div>Write it on paper and keep it safe. Anyone with this code and your number can reset your PIN.</div>
</div>
<div style="flex-grow: 1;"></div>
<label for="saved" style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 16px;">
<input id="saved" type="checkbox" checked="{{saved}}" onChange="{{toggle}}" style="width: 22px; height: 22px; accent-color: #0B6B57; margin: 0;">
I have written down my recovery code
</label>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}"><a href="EnableFingerprint.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #0B6B57; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; border: none; width: 100%; box-sizing: border-box;">Continue</a></sc-if>
<sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}"><button type="button" disabled="{{true}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #C9D3CE; color: #FFFFFF; font-size: 16px; font-weight: 700; border: none; width: 100%;">Continue</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { saved: false }; }
  renderVals() {
    return {
      saved: this.state.saved,
      notSaved: !this.state.saved,
      toggle: () => this.setState((s) => ({ saved: !s.saved }))
    };
  }
}
</script>
</body>
</html>
