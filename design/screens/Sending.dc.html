<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sending money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Sora:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9EDEA;font-family:'Manrope',system-ui,sans-serif;color:#10201B}
a{color:#0B6B57}a:hover{color:#084F40}
button,input{font-family:inherit}
@keyframes gk-fly{0%{transform:translateX(-96px) scale(.7);opacity:0}15%{opacity:1;transform:translateX(-70px) scale(1)}85%{opacity:1;transform:translateX(70px) scale(1)}100%{transform:translateX(96px) scale(.7);opacity:0}}
@keyframes gk-pulse{0%{transform:scale(.85);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes gk-fill{0%{width:0}100%{width:100%}}
@keyframes gk-pop{0%{transform:scale(0)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes gk-draw{0%{stroke-dashoffset:24}100%{stroke-dashoffset:0}}
@keyframes gk-rise{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes gk-burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(.4);opacity:0}}
@keyframes gk-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(1.9);opacity:0}}
.gk-fly{animation:gk-fly 1.1s cubic-bezier(.45,0,.25,1) infinite}
.gk-pulse{animation:gk-pulse 1.1s ease-out infinite}
.gk-fill{animation:gk-fill 1.8s ease-in-out both}
.gk-pop{animation:gk-pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.gk-draw{stroke-dasharray:24;animation:gk-draw .45s .35s ease-out both}
.gk-rise{animation:gk-rise .45s ease-out both}
.gk-d1{animation-delay:.45s}.gk-d2{animation-delay:.6s}.gk-d3{animation-delay:.75s}
.gk-burst{animation:gk-burst .8s .3s ease-out both}
.gk-ring{animation:gk-ring .9s .2s ease-out both}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; display: flex; flex-direction: column; background: #F3F5F2; font-family: 'Manrope', system-ui, sans-serif; color: #10201B; overflow: hidden; position: relative;">
<sc-if value="{{sending}}" hint-placeholder-val="{{true}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; text-align: center;">
<div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
<div style="font-size: 15px; font-weight: 600; color: #56665F;">Sending</div>
<div style="font-family: 'Sora', sans-serif; font-size: 48px; font-weight: 700; letter-spacing: -0.03em;">$10.00</div>
<div style="font-size: 16px; font-weight: 700;">to 61X XXX 4521</div>
</div>
<div style="display: flex; align-items: flex-start; gap: 0; width: 100%; justify-content: space-between;">
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;"><div style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E1E7E3; color: #0B6B57; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div><div style="font-size: 13px; font-weight: 700; color: #56665F;">You</div></div>
<div style="flex-grow: 1; height: 64px; position: relative; display: flex; align-items: center; justify-content: center;">
<div style="position: absolute; left: 8px; right: 8px; top: 31px; border-top: 2px dashed #B9D6CC;"></div>
<div class="gk-fly" style="width: 40px; height: 40px; border-radius: 50%; background: #0B6B57; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(11,107,87,0.35); font-family: 'Sora', sans-serif; font-weight: 700; font-size: 18px;">$</div>
</div>
<div style="position: relative;">
<div class="gk-pulse" style="position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #0B6B57; box-sizing: border-box;"></div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px;"><div style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E1E7E3; color: #0B6B57; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></div><div style="font-size: 13px; font-weight: 700; color: #56665F;">61X XXX 4521</div></div>
</div>
</div>
<div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
<div style="height: 8px; border-radius: 8px; background: #DCE5E0; overflow: hidden;"><div class="gk-fill" style="height: 100%; border-radius: 8px; background: #0B6B57;"></div></div>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; color: #56665F;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Securing your transfer…</div>
</div>
</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;">
<div style="position: relative; width: 140px; height: 140px; margin-bottom: 16px;">
<div class="gk-ring" style="position: absolute; inset: 0; border-radius: 50%; border: 3px solid #0B6B57;"></div>
<div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #F2B544; --a: 0deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #0B6B57; --a: 45deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #F2B544; --a: 90deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #7FC8B5; --a: 135deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #0B6B57; --a: 180deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #F2B544; --a: 225deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #7FC8B5; --a: 270deg;"></div><div class="gk-burst" style="position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #0B6B57; --a: 315deg;"></div>
<div class="gk-pop" style="position: absolute; inset: 0; border-radius: 50%; background: #E3F1EC; display: flex; align-items: center; justify-content: center;">
<div style="width: 96px; height: 96px; border-radius: 50%; background: #0B6B57; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="gk-draw" d="M20 6L9 17l-5-5"></path></svg></div>
</div>
</div>
<h1 class="gk-rise gk-d1" style="margin: 0; font-family: 'Sora', sans-serif; font-size: 28px; line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; color: #10201B; font-size: 30px;">Money sent!</h1>
<div class="gk-rise gk-d2" style="font-family: 'Sora', sans-serif; font-size: 40px; font-weight: 700; letter-spacing: -0.03em;">$10.00</div>
<div class="gk-rise gk-d3" style="font-size: 15px; color: #56665F;">Delivered to 61X XXX 4521 · just now</div>
</div>
<div class="gk-rise gk-d3" style="display: flex; flex-direction: column; gap: 12px;">
<a href="Receipt.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #0B6B57; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; border: none; width: 100%; box-sizing: border-box;">View receipt</a>
<a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 16px; background: #FFFFFF; color: #10201B; font-size: 16px; font-weight: 700; text-decoration: none; border: 1px solid #E1E7E3; width: 100%; box-sizing: border-box;">Back to Home</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { done: false }; }
  componentDidMount() { this.t = setTimeout(() => this.setState({ done: true }), 1900); }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() { return { sending: !this.state.done, done: this.state.done }; }
}
</script>
</body>
</html>
